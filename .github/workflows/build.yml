name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode signing key (if configured)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          if [ -n "$KS_B64" ]; then gradle assembleRelease; else gradle assembleDebug; fi
      - name: Collect APK + checksum
        run: |
          mkdir out
          if [ -n "$KS_B64" ]; then cp app/build/outputs/apk/release/app-release.apk out/HackerTubeLite.apk
          else cp app/build/outputs/apk/debug/app-debug.apk out/HackerTubeLite.apk; fi
          cd out && sha256sum HackerTubeLite.apk > HackerTubeLite.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HackerTubeLite
          path: out/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HackerTubeLite
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
